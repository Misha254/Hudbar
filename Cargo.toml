[package]
name = "hudbar"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "hud-settings-rs"
path = "src/bin/hud_settings.rs"

[[bin]]
name = "hud-menu-rs"
path = "src/bin/hud_menu.rs"

[[bin]]
name = "hud-keybinds-rs"
path = "src/bin/hud_keybinds.rs"

[[bin]]
name = "hud-yazibinds-rs"
path = "src/bin/hud_yazibinds.rs"

[dependencies]
chrono = "0.4.45"
cosmic-text = "0.19.0"
dbus = "0.9.12"
nix = { version = "0.31.3", features = ["poll", "fs", "signal"] }
png = "0.18.1"
# preserve_order держит порядок ключей settings.json: без него serde_json
# сортирует объект по алфавиту и каждая запись переставляет файл целиком.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
