[package]
name = "hudbar"
version = "0.6.0"
edition = "2024"

# Release-профиль панели и окон: сборки одноразовые, поэтому единый codegen-unit
# и thin-LTO дают меньший и быстрее работающий бинарник ценой времени сборки.
# strip убирает символы — они нужны только при отладке.
#
# `panic = "abort"` здесь НЕ включён намеренно: catch_unwind в проекте нет ни
# разу, а потоков много (tray, actions, workers), и паника в одном из них при
# abort уронила бы весь процесс, тогда как при unwind умирает только этот поток.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "hud-settings-rs"
path = "src/bin/hud_settings.rs"

[[bin]]
name = "hud-menu-rs"
path = "src/bin/hud_menu.rs"

[[bin]]
name = "hud-wallpaper-rs"
path = "src/bin/hud_wallpaper.rs"

[[bin]]
name = "hud-schemes-rs"
path = "src/bin/hud_schemes.rs"

[[bin]]
name = "hud-keybinds-rs"
path = "src/bin/hud_keybinds.rs"

[[bin]]
name = "hud-yazibinds-rs"
path = "src/bin/hud_yazibinds.rs"

[[bin]]
name = "hud-vpn-rs"
path = "src/bin/hud_vpn.rs"

[[bin]]
name = "hud-telegram-rs"
path = "src/bin/hud_telegram.rs"

[dependencies]
chrono = "0.4.45"
cosmic-text = "0.19.0"
dbus = "0.9.12"
nix = { version = "0.31.3", features = ["poll", "fs", "signal", "user"] }
png = "0.18.1"
# preserve_order держит порядок ключей settings.json: без него serde_json
# сортирует объект по алфавиту и каждая запись переставляет файл целиком.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
